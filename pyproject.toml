[project]
name = "tooltangle"
version = "0.1.0"
description = "Find which tools your LLM agent confuses and fix their descriptions with proof"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "bebz0", email = "romanbizonua@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "rich>=15",
    "typer>=0.27",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
