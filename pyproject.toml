[project]
name = "tooltangle"
version = "0.1.0"
description = "Find which tools your LLM agent confuses and fix their descriptions with proof"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "bebz0", email = "romanbizonua@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["mcp", "llm", "agents", "tool-calling", "evaluation", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "mcp>=1.30,<2",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "rich>=15",
    "scikit-learn>=1.9.1",
    "scipy>=1.18",
    "typer>=0.27",
]

[project.urls]
Repository = "https://github.com/bebz0/tooltangle"
Issues = "https://github.com/bebz0/tooltangle/issues"

[project.scripts]
tooltangle = "tooltangle.cli:app"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
