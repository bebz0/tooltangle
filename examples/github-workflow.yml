name: tool selection

on:
  pull_request:
    paths:
      - mcp.json
      - tooltangle.overrides.yaml
      - .tooltangle/**

jobs:
  tooltangle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: actions/setup-node@v7
      - uses: actions/cache@v6
        with:
          path: .tooltangle/cache.sqlite
          key: tooltangle-${{ hashFiles('.tooltangle/queries.jsonl', 'tooltangle.overrides.yaml') }}
          restore-keys: tooltangle-
      - run: uvx tooltangle check mcp.json --yes
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
